<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fractal WASM Benchmark</title>
  </head>

  <body>
    <main>
      <header>
        <h1>Fractal WASM Benchmark</h1>

        <p>
          Performance comparison of JavaScript, 
          WebAssembly and WebAssembly SIMD 
          using Mandelbrot and Julia fractals.
        </p>
      </header>

      <section id="visualizationSection">
        <h2>Fractal visualization</h2>

        <div id="renderControls">
          <label>
            Fractal
            <select id="fractalSelect">
              <option value="mandelbrot">
                Mandelbrot
              </option>
              <option value="julia">
                Julia
              </option>
            </select>
          </label>

          <label>
            Implementation
            <select id="implementationSelect">
              <option value="javascript">
                JavaScript
              </option>
              <option value="wasmScalar">
                WebAssembly
              </option>
              <option value="wasmSimd" selected>
                WebAssembly SIMD
              </option>
            </select>
          </label>

          <label>
            Resolution
            <select id="resolutionSelect">
              <option value="800x600" selected>
                800 x 600
              </option>
              <option value="1280x720">
                1280 x 720
              </option>
              <option value="1920x1080">
                1920 x 1080
              </option>
            </select>
          </label>

          <label>
            Max iterations
            <input
              id="maxIterationsInput"
              type="number"
              min="1"
              step="1"
              value="500"
            >
          </label>

          <div
            id="juliaControls"
            hidden
          >
            <label>
              Julia c real
              <input
                id="juliaRealInput"
                type="number"
                step="0.001"
                value="-0.8"
              >
            </label>

            <label>
              Julia c imaginary
              <input
                id="juliaImaginaryInput"
                type="number"
                step="0.001"
                value="0.156"
              >
            </label>
          </div>

          <button
            id="renderButton"
            type="button"
          >
            Render
          </button>

          <button
            id="resetSettingsButton"
            type="button"
          >
            Reset settings
          </button>
          
          <p id="renderStatus"></p>
        </div>

        <canvas
          id="fractalCanvas"
          width="800"
          height="600"
        ></canvas>
      </section>

      <section id="benchmarkSection">
        <h2>Benchmark experiment</h2>

        <p>
          Run the complete predefined benchmark suite 
          comparing JavaScript, WebAssembly and 
          WebAssembly SIMD.
        </p>

        <button
          id="runBenchmarkButton"
          type="button"
        >
          Run Benchmark
        </button>

        <button
          id="exportJsonButton"
          type="button"
          disabled
        >
          Export JSON
        </button>

        <button
          id="exportCsvButton"
          type="button"
          disabled
        >
          Export CSV
        </button>

        <div
          id="benchmarkProgress"
          hidden
        >
          <p id="benchmarkStatus">
            Ready
          </p>

          <progress
            id="benchmarkProgressBar"
            value="0"
            max="22"
          ></progress>

          <p id="benchmarkProgressText">
            0 / 22
          </p>

          <p id="benchmarkScenario"></p>
        </div>
      </section>
    </main>

    <script
      type="module"
      src="./js/main.js"
    ></script>
  </body>
</html>
